name: CI Test Suite and Secret Scan

on:
  push:
    branches: [ v2, main ]
  pull_request:
    branches: [ v2, main ]

jobs:
  test:
    name: Node 22 Test & Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify zero tracked secrets or databases
        run: |
          echo "Scanning tracked files for secrets and databases..."
          # Check for tracked .env files or .db files
          TRACKED_FORBIDDEN=$(git ls-files | grep -E '(\.env$|\.env\.local$|\.db$|data/.*\.db$)' || true)
          if [ -n "$TRACKED_FORBIDDEN" ]; then
            echo "❌ CRITICAL SECURITY ERROR: Forbidden secret/database files are tracked in git:"
            echo "$TRACKED_FORBIDDEN"
            exit 1
          fi
          echo "✅ No .env or .db files tracked in git repository."

      - name: Run secret-pattern scan
        run: |
          echo "Scanning codebase for unredacted API key patterns..."
          # Search for patterns resembling active API keys in tracked files (excluding test mocks, docs, and git files)
          POTENTIAL_SECRETS=$(git grep -EI '(BITGET_LIVE_API_KEY=[a-zA-Z0-9_-]{10,}|BITGET_LIVE_API_SECRET=[a-zA-Z0-9_-]{10,}|-----BEGIN PRIVATE KEY-----)' || true)
          if [ -n "$POTENTIAL_SECRETS" ]; then
            echo "❌ CRITICAL SECURITY ERROR: Potential unredacted API key or private key detected:"
            echo "$POTENTIAL_SECRETS"
            exit 1
          fi
          echo "✅ Secret-pattern scan passed cleanly."

      - name: Run Test Suite
        run: node --test --test-force-exit --test-timeout=60000
